<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the layout reaches under the notch on a phone; the
     safe-area insets below keep the controls out of it. No maximum-scale: browser
     zoom stays available. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Møteromskart – Grensesvingen 6</title>
<meta name="description" content="Finn møterom i Grensesvingen 6, etasje 3–8.">
<link rel="manifest" href="manifest.webmanifest">
<!-- The browser and iOS chrome follow the theme instead of flashing white. -->
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Møteromskart">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- iOS ignores both the manifest icons and SVG here, so it gets its own PNG. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // Resolve the theme before the first paint, so there is no flash of the wrong one.
  // No stored choice means follow the system.
  document.documentElement.dataset.theme = localStorage.theme
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --plane: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-muted: #898781;
  --line: #e1e0d9;
  --ring: rgba(11, 11, 11, .1);
  /* Darkened just enough that white text on them clears 4.5:1, since the pills
     are filled with these. */
  --series-1: #2974d0;  /* Møterom */
  --series-2: #be542a;  /* Multirom */
  --series-3: #15855d;  /* øvrige romtyper */
  --plan-invert: 0;
}
/* The script in <head> always resolves data-theme to light or dark, so the system
   preference needs no media query of its own. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19;
  --plane: #0d0d0d;
  --ink: #fff;
  --ink-2: #c3c2b7;
  --line: #2c2c2a;
  --ring: rgba(255, 255, 255, .1);
  --series-1: #3275c7;
  --series-2: #c35022;
  --series-3: #15855e;
  --plan-invert: 1;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--plane);
  height: 100dvh;
  /* No pull-to-refresh or rubber-banding of the whole app: on a phone the gesture
     that pans the map starts the same way as the one that reloads the page. */
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  /* Nothing may escape the viewport: if the page itself scrolls, the map has
     grown past its box and its own scrolling is silently dead. */
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* The floors, the count and the search box stay put while the room list scrolls
   under them: with the list six floors long, the controls would otherwise be
   somewhere above the top of the panel most of the time. */
.controls {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 0 8px;
  background: var(--surface);
}

/* The sheet's handle, and nowhere else: on any layout with room for a column, the
   panel is that column and has nothing to drag. */
.grip {
  display: none;
  width: 100%;
  padding: 12px 0;
  border: 0;
  background: none;
  cursor: grab;
  touch-action: none;   /* the drag is ours, not the page's */
}
.grip::before {
  content: "";
  display: block;
  width: 36px;
  height: 4px;
  margin: 0 auto;
  border-radius: 999px;
  background: var(--ink-muted);
}
/* One line, cut off if it has to be: the count sits under the floor buttons, and
   wrapping it would push the search box down. */
#status {
  font-size: 11px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

button, input, select { font: inherit; color: inherit; }

/* Six floors, six equal columns: in a panel this narrow, letting the buttons size
   themselves is what makes them wrap onto a second row. */
.floors { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.floors button {
  padding: 5px 4px;
  border: 1px solid var(--ring);
  border-radius: 6px;
  background: transparent;
  cursor: pointer;
}
.floors button:hover { background: var(--plane); }
.floors button[aria-current="true"] {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink);
}

/* Floating in the map's left corners: the panel toggle on the panel's own edge at
   the top, the theme button at the bottom, opposite the zoom controls. */
#theme, #collapse {
  position: absolute;
  left: 14px;
  z-index: 5;
  width: 32px;
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(6px);
  box-shadow: 0 2px 12px var(--ring);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
}
#theme { bottom: 14px; }
#collapse { top: 14px; }
#theme:hover, #collapse:hover { background: var(--plane); }

#q {
  width: 100%;
  /* 16px, not the inherited 15: iOS zooms the whole page in when a field smaller
     than that takes focus, and a zoomed page pans under one finger instead of
     leaving the drag to the map. Not behind a media query — a device that reports
     its pointer as fine would still do it. */
  font-size: 16px;
  padding: 6px 10px;
  border: 1px solid var(--ring);
  border-radius: 6px;
  background: var(--plane);
}

main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(240px, 300px) 1fr;
  /* There is no header above us any more, so installed on a phone the plan would
     otherwise start under the notch. */
  padding-top: env(safe-area-inset-top);
  background: var(--surface);
}
/* Collapsed, the panel is plain [hidden] and its column goes with it. This selector
   outweighs the bare `main` rules in the media queries below, so the collapse holds
   in every layout without being repeated in each of them. */
main:has(#panel[hidden]) { grid-template-columns: 1fr; }
/* [hidden] is a UA rule, and the sheet's own `display: flex` further down outranks
   it, so say it here where it cannot be lost. */
#panel[hidden] { display: none; }

/* ---- map ---- */

/* Both min-*: 0 are load-bearing. A grid item's automatic minimum size is its
   min-content size, so without these .map refuses to shrink below the full height
   of the plan, .viewport is handed that height, and nothing is left to scroll. */
.map { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* Floating over the plan's bottom right corner rather than sitting in a bar of its
   own: the plan gets the whole panel, and the controls stay where the thumb is. */
.toolbar {
  position: absolute;
  right: 14px;
  bottom: 14px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  font-size: 13px;
  color: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(6px);
  box-shadow: 0 2px 12px var(--ring);
}
.toolbar button {
  flex: none;
  width: 28px;
  height: 28px;
  border: 1px solid var(--ring);
  border-radius: 6px;
  background: var(--surface);
  cursor: pointer;
}
.toolbar button.wide { width: auto; padding: 0 10px; }
#zoom { width: 140px; accent-color: var(--series-1); }

.viewport {
  flex: 1;
  overflow: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  touch-action: none;   /* we drive pan and pinch ourselves */
  cursor: grab;
}
.viewport.dragging { cursor: grabbing; }
/* Half a view of empty sheet on every side. A drag that runs into the plan's edge
   stops dead and reads as a map that has stopped listening, so there is always
   somewhere left to go — and never more than half a view of it, so the plan cannot
   be pushed off the screen and lost.
   A transparent border, of all things, because the other two ways of holding space
   both have a catch: a margin's far side is the corner of scrollable overflow that
   engines have historically disagreed about, and padding would stretch the box the
   pills measure their percentages against. A border box is always scrollable, and
   sits outside the padding box the pills use. content-box so the width still means
   the image, which is what the zoom sets. */
.plan {
  position: relative;
  box-sizing: content-box;
  width: 100%;
  /* Two values, so the width cannot ride along in the border shorthand. */
  border: solid transparent;
  border-width: 50svh 50vw;
  user-select: none;
}
.plan img {
  display: block;
  width: 100%;
  /* iOS pops the image action menu on a press that lingers, and that cancels the
     pointer stream the pan runs on — a drag that starts slowly would die. The
     touch-action here only repeats the viewport's, where WebKit has been shaky
     about inheriting it down to the element actually touched. */
  -webkit-touch-callout: none;
  touch-action: none;
  filter: invert(var(--plan-invert)) hue-rotate(calc(var(--plan-invert) * 180deg));
}

.marker {
  position: absolute;
  left: var(--x);
  top: var(--y);
  translate: -50% -50%;
  padding: 2px 6px;
  /* Filled with the type colour, white on top: the type reads from across the
     room instead of from a 2px ring. The outer ring of surface colour lifts the
     pill clear of the line work printed underneath it. */
  border: 0;
  border-radius: 999px;
  box-shadow: 0 0 0 2px var(--surface);
  font: 700 11px/1.35 system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
  white-space: nowrap;
  color: #fff;
  background: var(--c);
  cursor: pointer;
}
.marker[data-color="1"] { --c: var(--series-1); }
.marker[data-color="2"] { --c: var(--series-2); }
.marker[data-color="3"] { --c: var(--series-3); }
.marker:hover, .marker:focus-visible, .marker.hot { z-index: 3; scale: 1.25; }
/* Pointed at from the panel — a room row, or a whole type's heading — the pills wear
   the ring the selected one wears, so the answer to "where is that" is on the plan
   before anything is clicked. */
.marker.hot { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c); }
/* Searched past, or standing next to what the panel is pointing at: either way the
   pill steps back rather than disappearing, since it is still a room on this floor.
   The one being pointed at comes back to full even if the search had faded it. */
.marker.faded, .plan.pointing .marker:not(.hot) { opacity: .25; }
.plan.pointing .marker.hot { opacity: 1; }
.marker[aria-current="true"] {
  z-index: 4;
  scale: 1.35;
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c);
}

/* ---- panel ---- */

aside {
  border-right: 1px solid var(--line);
  background: var(--surface);
  overflow: auto;
  min-height: 0;   /* same reason as .map */
  /* No padding at the top: it belongs to .controls, which is sticky, so the list
     must not scroll through a gap above it. */
  padding: 0 max(14px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom))
           max(14px, env(safe-area-inset-left));
}

h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
  margin: 14px 0 4px;
}
/* The group heading is the type filter: clicking it hides that type's rooms from
   the plan, and the heading stays behind — dimmed — as the way back. */
.type {
  display: block;
  width: 100%;
  padding: 3px 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  font: inherit;
  text-align: left;
  /* The type's own colour, pushed towards the text colour: the fills these hues
     were picked for carry white text, and as text on the panel they need the
     extra contrast in both themes. */
  color: color-mix(in oklab, var(--c) 70%, var(--ink));
  cursor: pointer;
}
.type[aria-pressed="false"] { color: var(--ink-muted); }
.type:hover { background: var(--plane); }
.rooms { list-style: none; margin: 0; padding: 0; }
.rooms button {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  padding: 5px 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  text-align: left;
  cursor: pointer;
}
.rooms button:hover { background: var(--plane); }
.rooms button[aria-current="true"] { background: var(--plane); box-shadow: inset 2px 0 0 var(--ink); }
.rooms .code { font-weight: 600; font-variant-numeric: tabular-nums; }
.rooms .meta { color: var(--ink-2); font-size: 13px; }
.rooms .floor {
  margin-left: auto;
  font-size: 11px;
  color: var(--ink-2);
  border: 1px solid var(--ring);
  border-radius: 4px;
  padding: 0 5px;
}
.empty { color: var(--ink-2); font-size: 13px; padding: 8px 0; }

/* Narrow laptops: the panel gives width back to the plan before the layout has to
   break into one column. */
@media (max-width: 1024px) {
  main { grid-template-columns: minmax(200px, 250px) 1fr; }
}

/* Two fingers already zoom the plan on a phone, and picking a room zooms in by
   itself, so the slider only costs height. */
@media (max-width: 720px) {
  .toolbar { display: none; }
}

/* A phone held upright: the plan takes the whole window, and the panel sits over its
   bottom edge as a translucent bar — the floors, the count and the search box — that
   the grip drags up into the room list. */
@media (max-width: 720px) and (orientation: portrait) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr; }

  aside {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6;               /* over the buttons floating on the plan */
    max-height: 88dvh;        /* also the ceiling on a drag, which sets a height */
    display: flex;
    flex-direction: column;
    overflow: hidden;         /* the list inside scrolls; the sheet itself never does */
    border: 0;
    border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0;
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    backdrop-filter: blur(12px);
    box-shadow: 0 -2px 20px var(--ring);
  }
  /* Closed, the sheet is as tall as the bar it holds; open, it is a fixed slice of
     the window with the list scrolling in whatever is left under the controls. */
  aside.open { height: 70dvh; }
  aside:not(.open) #list { display: none; }
  #list { flex: 1; overflow: auto; overscroll-behavior: contain; }

  .grip { display: block; }
  /* The grip is the way to put the panel away here, so the button that does it on a
     laptop only takes up plan. And since it is gone, a panel left [hidden] by a
     wider layout has to come back, or nothing could bring it back. */
  #collapse { display: none; }
  #panel[hidden] { display: flex; }
  /* The bottom left corner belongs to the sheet down here. */
  #theme { top: 14px; bottom: auto; left: auto; right: 14px; }
}

/* A phone on its side has the width for two columns and nowhere near the height for
   the sheet, so it keeps the desktop layout, only narrower. */
@media (max-width: 720px) and (orientation: landscape) {
  main { grid-template-columns: minmax(180px, 40%) 1fr; }
}

/* Fingers, not a cursor: everything hittable grows to roughly 44px, and the pills
   on the plan grow with it. */
@media (pointer: coarse) {
  .floors button { min-height: 40px; }
  #theme, #collapse, .toolbar button { width: 40px; height: 40px; }
  #q { padding: 9px 10px; }
  #zoom { height: 32px; }
  .type { padding: 8px 6px; }
  .grip { padding: 14px 0; }
  .rooms button { padding: 9px 6px; }
  .marker { padding: 4px 8px; font-size: 12px; }
}
</style>
</head>
<body>

<!-- The title lives in <title> and in the app name; on screen the floor buttons took
     its place. It stays here for screen readers, which need a heading — outside the
     panel, which is gone from the page while collapsed. -->
<h1 class="sr-only">Møteromskart – Grensesvingen 6</h1>

<main>
  <aside id="panel">
    <!-- The sheet's drag handle on a phone. A button too, so a tap or the keyboard
         opens what a drag opens; display: none keeps it out of every other layout. -->
    <button type="button" class="grip" id="grip" aria-expanded="false"
            aria-controls="list" aria-label="Vis eller skjul romlisten"></button>
    <div class="controls">
      <nav class="floors" id="floors" aria-label="Etasje"></nav>
      <span id="status" aria-live="polite"></span>
      <search>
        <input id="q" type="search" aria-label="Søk etter rom"
               placeholder="Søk etter rom, f.eks. 372" autocomplete="off">
      </search>
    </div>
    <div id="list"></div>
  </aside>

  <section class="map">
    <div class="toolbar">
      <label for="zoom">Zoom</label>
      <button type="button" id="out" aria-label="Zoom ut">−</button>
      <input id="zoom" type="range" min="100" max="450" step="1" value="100">
      <button type="button" id="in" aria-label="Zoom inn">+</button>
      <button type="button" id="fit" class="wide">Tilpass</button>
    </div>
    <div class="viewport" id="viewport">
      <div class="plan" id="plan">
        <!-- draggable="false": dragging an image is a native browser gesture, and it
             cancels the pointer stream we pan with the moment the mouse moves. -->
        <img id="planimg" alt="" draggable="false">
      </div>
    </div>
    <button type="button" id="collapse" aria-expanded="true" aria-controls="panel"></button>
    <button type="button" id="theme"></button>
  </section>
</main>

<script>
const FLOOR_ORDER = ['3', '4', '5', '6', '7', '8'];
const TYPE_ORDER = ['Møterom', 'Multirom', 'Prosjektrom', 'Pod 1p', 'Sosial sone', 'Hvilerom', 'Datarom'];
// Three validated categorical hues; everything past the two meeting-room types
// shares slot 3. The exact type is always spelled out in text, never colour alone.
const COLOR = { 'Møterom': '1', 'Multirom': '2' };

const el = {
  floors: document.getElementById('floors'),
  q: document.getElementById('q'),
  zoom: document.getElementById('zoom'),
  viewport: document.getElementById('viewport'),
  plan: document.getElementById('plan'),
  img: document.getElementById('planimg'),
  theme: document.getElementById('theme'),
  panel: document.getElementById('panel'),
  collapse: document.getElementById('collapse'),
  grip: document.getElementById('grip'),
  list: document.getElementById('list'),
  status: document.getElementById('status'),
};

let rooms = {};       // floor -> [room]
let names = {};       // "N 381" -> "Bjørvika"
let floor = '3';
let selected = null;  // slug
let hidden = new Set();

const slug = code => code ? code.replace(/\s+/g, '') : '';
const norm = s => (s || '').toLowerCase().replace(/\s+/g, '');
const id = r => slug(r.code) || `${r.type}-${r.x}`;
const nameOf = r => names[r.code] || '';
const label = r => [r.code || 'uten romnummer', nameOf(r)].filter(Boolean).join(' · ');

function all() {
  return FLOOR_ORDER.flatMap(f => (rooms[f] || []).map(r => ({ ...r, floor: f })));
}

// Query only: a hidden type still gets its heading in the list, so hiding has to
// stay out of the search itself.
function matches(r, query) {
  if (!query) return true;
  return norm(r.code + r.type + nameOf(r)).includes(query);
}

const shown = (r, query) => !hidden.has(r.type) && matches(r, query);

/* ---------- rendering ---------- */

function renderFloors() {
  el.floors.replaceChildren(...FLOOR_ORDER.map(f => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = f + '.';
    b.setAttribute('aria-label', `${f}. etasje`);
    b.setAttribute('aria-current', String(f === floor));
    b.onclick = () => setFloor(f);
    return b;
  }));
}

function renderMarkers(query) {
  const markers = (rooms[floor] || [])
    .filter(r => !hidden.has(r.type))
    .map(r => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'marker';
      b.dataset.color = COLOR[r.type] || '3';
      b.dataset.id = id(r);
      b.dataset.type = r.type;
      b.style.setProperty('--x', (r.x * 100).toFixed(2) + '%');
      b.style.setProperty('--y', (r.y * 100).toFixed(2) + '%');
      // The number exactly as it is written everywhere else, space included; only
      // the deep link and the marker's own id run it through slug().
      b.textContent = r.code || '•';
      b.title = `${r.type} ${label(r)}`;
      b.setAttribute('aria-label', `${r.type} ${label(r)}`);
      if (query && !matches(r, query)) b.classList.add('faded');
      if (id(r) === selected) b.setAttribute('aria-current', 'true');
      b.onclick = () => select(id(r), false);
      return b;
    });
  // The pills these applied to are gone; the class would fade the new ones instead.
  el.plan.classList.remove('pointing');
  el.plan.replaceChildren(el.img, ...markers);
  el.status.textContent = `${markers.length} rom i ${floor}. etasje`;
}

function roomButton(r, showFloor) {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.id = id(r);
  if (id(r) === selected && r.floor === floor) b.setAttribute('aria-current', 'true');

  const code = document.createElement('span');
  code.className = 'code';
  code.textContent = r.code || '—';
  const meta = document.createElement('span');
  meta.className = 'meta';
  meta.textContent = nameOf(r) || r.type;
  b.append(code, meta);

  if (showFloor) {
    const f = document.createElement('span');
    f.className = 'floor';
    f.textContent = r.floor + '. et.';
    b.append(f);
  }
  b.onclick = () => {
    if (r.floor !== floor) setFloor(r.floor, id(r));
    else select(id(r), true);
  };
  return b;
}

function renderList(query) {
  const hits = (query ? all() : all().filter(r => r.floor === floor)).filter(r => matches(r, query));

  const groups = [];
  for (const type of TYPE_ORDER) {
    const inGroup = hits.filter(r => r.type === type);
    if (!inGroup.length) continue;

    // The heading doubles as the type's filter, so it is rendered whether the type
    // is hidden or not — hidden, it is the only way back.
    const h = document.createElement('h2');
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'type';
    toggle.dataset.type = type;
    toggle.style.setProperty('--c', `var(--series-${COLOR[type] || '3'})`);
    toggle.setAttribute('aria-pressed', String(!hidden.has(type)));
    toggle.textContent = `${type} (${inGroup.length})`;
    toggle.onclick = () => {
      hidden.has(type) ? hidden.delete(type) : hidden.add(type);
      render();
    };
    h.append(toggle);
    groups.push(h);
    if (hidden.has(type)) continue;

    const ul = document.createElement('ul');
    ul.className = 'rooms';
    ul.append(...inGroup.map(r => {
      const li = document.createElement('li');
      li.append(roomButton(r, Boolean(query)));
      return li;
    }));
    groups.push(ul);
  }

  if (!groups.length) {
    groups.push(Object.assign(document.createElement('p'), {
      className: 'empty',
      textContent: 'Ingen treff.',
    }));
  }
  el.list.replaceChildren(...groups);
}

function render() {
  const query = norm(el.q.value);
  el.img.src = `plan-${floor}.png`;
  el.img.alt = `Plantegning ${floor}. etasje`;
  renderFloors();
  renderMarkers(query);
  renderList(query);
}

/* ---------- state ---------- */

// Every floor is rendered at the same size by build.py, so the plan's shape is a
// constant and needs no loaded image to measure.
const PLAN_RATIO = 1820 / 2659;

// Fit is the whole width — except in a window taller than the plan is at that width,
// where the leftover band would be most of the screen. There it fills the height
// instead and pans sideways. That case is a phone held upright.
function fitZoom() {
  const box = el.viewport.getBoundingClientRect();
  if (box.height <= box.width) return 100;
  // Where the panel is a sheet it lies over the bottom of the plan, and only a plan
  // taller than the window by that much can be dragged out from under it. It also
  // leaves the up and down drags something to move, which an exact fill does not.
  const covered = getComputedStyle(el.panel).position === 'fixed' ? el.panel.offsetHeight : 0;
  return Math.min(450, Math.max(100, 100 * (box.height + covered) / (box.width * PLAN_RATIO)));
}

// Fit, then park in the middle of whatever the plan overflows by. Against an edge —
// and filling the height puts the plan hard against its left one — half the drags a
// finger can make move nothing at all, which reads as a dead map rather than as an
// edge.
function fit() {
  setZoom(fitZoom());
  el.viewport.scrollLeft = (el.viewport.scrollWidth - el.viewport.clientWidth) / 2;
  el.viewport.scrollTop = (el.viewport.scrollHeight - el.viewport.clientHeight) / 2;
}

// Zooms around a point on screen (fingers, cursor) so it stays put; defaults to
// the middle of the viewport, which is what the slider and buttons want.
function setZoom(v, anchorX, anchorY) {
  const box = el.viewport.getBoundingClientRect();
  if (anchorX === undefined) {
    anchorX = box.left + box.width / 2;
    anchorY = box.top + box.height / 2;
  }
  // The plan's width is a percentage of the viewport, so it tracks the zoom value
  // exactly — no need to measure it, which would force a layout on every wheel tick.
  // Read the scroll offsets first: resizing the plan can clamp them on the way out.
  const from = Number(el.zoom.value);
  const x = anchorX - box.left;
  const y = anchorY - box.top;
  const scrolled = { x: el.viewport.scrollLeft, y: el.viewport.scrollTop };
  // The empty border around the plan is a fixed size and does not scale with it, so
  // it comes out of the arithmetic and goes back in afterwards.
  const slack = { x: el.plan.clientLeft, y: el.plan.clientTop };

  el.zoom.value = String(Math.round(Math.min(450, Math.max(100, v))));
  el.plan.style.width = el.zoom.value + '%';

  const scale = Number(el.zoom.value) / from;
  if (scale !== 1) {
    el.viewport.scrollLeft = slack.x + (scrolled.x + x - slack.x) * scale - x;
    el.viewport.scrollTop = slack.y + (scrolled.y + y - slack.y) * scale - y;
  }
}

function select(target, zoomIn) {
  selected = target;
  if (zoomIn && Number(el.zoom.value) < 200) setZoom(200);
  render();
  const marker = [...el.plan.querySelectorAll('.marker')].find(m => m.dataset.id === target);
  if (marker) marker.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
  // The row is already marked current; bring it into the panel too, so a pill
  // clicked on the map points at its own row. 'nearest' so a row that is already
  // visible — the usual case when the click came from the panel — stays put.
  el.list.querySelector('[aria-current="true"]')?.scrollIntoView({ block: 'nearest' });
  history.replaceState(null, '', `#${floor}/${target}`);
}

function setFloor(f, target = null) {
  floor = f;
  selected = target;
  render();
  if (target) select(target, true);
  else history.replaceState(null, '', `#${floor}`);
}

function fromHash() {
  const [f, target] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (!FLOOR_ORDER.includes(f)) return;
  floor = f;
  selected = target || null;
  render();
  if (selected) select(selected, true);
}

/* ---------- theme ---------- */

// Cycles system -> light -> dark -> system, so picking a theme once doesn't mean
// giving up following the system forever. No stored value means follow.
const systemDark = matchMedia('(prefers-color-scheme: dark)');
const THEMES = {
  '': { icon: '◐', text: 'Tema: følger systemet', next: 'light' },
  light: { icon: '☀', text: 'Tema: lyst', next: 'dark' },
  dark: { icon: '☾', text: 'Tema: mørkt', next: '' },
};

function applyTheme() {
  const choice = localStorage.theme || '';
  document.documentElement.dataset.theme = choice || (systemDark.matches ? 'dark' : 'light');
  el.theme.textContent = THEMES[choice].icon;
  el.theme.title = THEMES[choice].text;
  el.theme.setAttribute('aria-label', THEMES[choice].text);
}

el.theme.onclick = () => {
  const next = THEMES[localStorage.theme || ''].next;
  if (next) localStorage.theme = next;
  else localStorage.removeItem('theme');
  applyTheme();
};
systemDark.onchange = applyTheme;
applyTheme();

/* ---------- panel ---------- */

// Collapsed, the panel is plain [hidden]: it leaves the layout altogether and the
// plan takes the window. The toggle floats on the plan, so it survives the collapse
// and is the way back.
function setPanel(open) {
  el.panel.toggleAttribute('hidden', !open);
  el.collapse.setAttribute('aria-expanded', String(open));
  el.collapse.textContent = open ? '◀' : '▶';
  const text = open ? 'Skjul panelet' : 'Vis panelet';
  el.collapse.title = text;
  el.collapse.setAttribute('aria-label', text);
}

el.collapse.onclick = () => setPanel(el.panel.hidden);
setPanel(true);

/* ---------- the sheet, on a phone ---------- */

// Where the panel is a bar across the bottom of the plan, the grip drags it open and
// shut. Dragging sets a height in px and follows the finger; letting go snaps, by
// direction, to one of the two states CSS owns. Everywhere else the grip is
// display: none and none of this runs.
let grab = null;        // where the drag started, and the sheet's height there
let swallowTap = false; // a drag ends in a click of its own; that one must not toggle

function setSheet(open) {
  el.panel.classList.toggle('open', open);
  el.panel.style.height = '';   // back to the height the stylesheet picks
  el.grip.setAttribute('aria-expanded', String(open));
}

el.grip.addEventListener('pointerdown', e => {
  grab = {
    y: e.clientY,
    height: el.panel.offsetHeight,
    open: el.panel.classList.contains('open'),
    moved: false,
  };
});

// On the window, like the map's pan: the finger leaves the grip long before the
// gesture is over.
addEventListener('pointermove', e => {
  if (!grab) return;
  const dy = grab.y - e.clientY;
  if (!grab.moved && Math.abs(dy) < 4) return;
  grab.moved = true;
  // The list has to be in the sheet for the sheet to have anything to grow over.
  el.panel.classList.add('open');
  el.panel.style.height = Math.max(0, grab.height + dy) + 'px';
});

function endSheetDrag(e) {
  if (!grab) return;
  const { y, open, moved } = grab;
  grab = null;
  if (!moved) return;   // a tap: onclick below has it, and the keyboard with it
  swallowTap = true;
  const dy = y - e.clientY;
  setSheet(Math.abs(dy) > 40 ? dy > 0 : open);
}
addEventListener('pointerup', endSheetDrag);
addEventListener('pointercancel', endSheetDrag);

el.grip.onclick = () => {
  if (swallowTap) swallowTap = false;
  else setSheet(!el.panel.classList.contains('open'));
};

/* ---------- drag to pan, pinch to zoom ---------- */

const pointers = new Map();
let pinch = null;      // distance + zoom at the moment the second finger landed
let travelled = 0;     // so a drag that ends on a marker isn't taken for a click
let swallowUntil = 0;

el.viewport.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  pointers.set(e.pointerId, e);
  pinch = null;
  travelled = 0;
  el.viewport.classList.add('dragging');
});

addEventListener('pointermove', e => {
  const previous = pointers.get(e.pointerId);
  if (!previous) return;
  pointers.set(e.pointerId, e);
  const [a, b] = [...pointers.values()];

  if (b) {
    const spread = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (!pinch) pinch = { spread, zoom: Number(el.zoom.value) };
    else if (pinch.spread) {
      travelled = Infinity;
      setZoom(pinch.zoom * spread / pinch.spread, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
    }
  } else {
    const dx = e.clientX - previous.clientX;
    const dy = e.clientY - previous.clientY;
    travelled += Math.abs(dx) + Math.abs(dy);
    el.viewport.scrollLeft -= dx;
    el.viewport.scrollTop -= dy;
  }
  e.preventDefault();
}, { passive: false });

function endGesture(e) {
  if (!pointers.delete(e.pointerId)) return;
  pinch = null;
  if (!pointers.size) {
    el.viewport.classList.remove('dragging');
    // A drag's own click lands immediately. Anything later — a keyboard Enter on
    // a marker, say — is a real click and must get through.
    swallowUntil = travelled > 4 ? e.timeStamp + 300 : 0;
  }
}
addEventListener('pointerup', endGesture);
addEventListener('pointercancel', endGesture);

el.viewport.addEventListener('click', e => {
  if (e.timeStamp > swallowUntil) return;
  swallowUntil = 0;
  e.stopPropagation();
  e.preventDefault();
}, true);

// Every wheel event is ours: a trackpad pinch arrives as one with ctrlKey set, a
// two-finger scroll as one without. Letting the browser scroll the plan natively
// while we also write scrollLeft to anchor a zoom means two owners fighting over
// the same offset, which is what makes interleaved panning and pinching stutter.
el.viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const lines = e.deltaMode === 1 ? 16 : 1;   // some mice report lines, not pixels
  if (e.ctrlKey || e.metaKey) {
    // Pinch ticks are small and frequent; a mouse wheel notch is a single big one,
    // so cap the step or one notch would swallow the whole range.
    const step = Math.max(-30, Math.min(30, e.deltaY * lines));
    setZoom(Number(el.zoom.value) * Math.exp(-step / 120), e.clientX, e.clientY);
  } else {
    el.viewport.scrollLeft += e.deltaX * lines;
    el.viewport.scrollTop += e.deltaY * lines;
  }
}, { passive: false });

/* ---------- wiring ---------- */

// A search covers every floor, and the list says so. Follow it on the plan too: if
// nothing on the floor being shown matches, switch to the lowest floor that does,
// rather than leaving an empty plan next to a list full of hits.
el.q.oninput = () => {
  const query = norm(el.q.value);
  const hits = all().filter(r => shown(r, query));
  if (query && hits.length && !hits.some(r => r.floor === floor)) setFloor(hits[0].floor);
  else render();
};
// Hovering the panel points at the plan: a room row lights its own pill, a type's
// heading lights every pill of that type. Delegated on the list — it is rebuilt on
// every render — and mouseover/mouseout because those bubble, unlike mouseenter.
function highlight(target) {
  const room = target?.dataset.id;
  const type = target?.dataset.type;
  let lit = 0;
  for (const marker of el.plan.querySelectorAll('.marker')) {
    const hot = room ? marker.dataset.id === room : Boolean(type) && marker.dataset.type === type;
    marker.classList.toggle('hot', hot);
    lit += hot;
  }
  // Only fade the rest once something is actually lit: a row can point at a room on
  // another floor, and that must not dim the whole plan for nothing.
  el.plan.classList.toggle('pointing', lit > 0);
}
el.list.addEventListener('mouseover', e => highlight(e.target.closest('button')));
el.list.addEventListener('mouseout', () => highlight(null));

el.zoom.oninput = () => setZoom(Number(el.zoom.value));
document.getElementById('in').onclick = () => setZoom(Number(el.zoom.value) + 50);
document.getElementById('out').onclick = () => setZoom(Number(el.zoom.value) - 50);
document.getElementById('fit').onclick = fit;
window.onhashchange = fromHash;

Promise.all([
  fetch('rooms.json').then(r => r.json()),
  fetch('names.json').then(r => r.json()).catch(() => ({})),
]).then(([r, n]) => {
  rooms = r;
  names = n;
  // render() first: fit() measures the sheet, and the sheet is only as tall as the
  // floor buttons render it.
  render();
  fit();
  fromHash();
}).catch(err => {
  el.list.textContent = 'Klarte ikke å laste romdata.';
  console.error(err);
});

// Installable and offline-capable. Nothing on the page depends on it, so a browser
// without service workers — or the file opened straight off disk — just skips it.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
}
</script>
</body>
</html>
