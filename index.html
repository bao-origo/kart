<!doctype html>
<html lang="nb">
<head>

<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#242a32" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // Resolve the theme before the first paint, so there is no flash of the wrong one.
  // No stored choice means follow the system.
  document.documentElement.dataset.theme = localStorage.theme
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
<style>
:root {
  color-scheme: light;
  --surface: #ffffff;
  --plane: #f5f7f9;

  --ink-2: #5e6b78;

  --ring: #26323f0d;
  --accent: #425c77;
  --accent-soft: #edf1f6;
  --series-1: #7296b5;
  --series-2: #bea088;
  --series-3: #7fa9b1;
  --series-4: #a99bbe;
  --series-5: #c0ac79;
  --plan-invert: 0;
  --shadow: 0 2px 8px #26323f08;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #242a32;
  --plane: #191f27;
  --ink: #eff3f7;
  --ink-2: #bdc7d2;
  --ink-muted: #a5b0bc;
  --line: #3b4653;
  --ring: #0002;
  --accent: #bdcee1;
  --accent-soft: #303d4d;
  --series-1: #9fb6d0;
  --series-2: #c7af9a;
  --series-3: #9fc1c6;
  --series-4: #baafd0;
  --series-5: #d0c195;
  --plan-invert: 1;
  --shadow: 0 2px 8px #0002;
}
* { box-sizing: border-box; }

  margin: 0;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--surface);
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

button, summary, select { -webkit-tap-highlight-color: transparent; }
button, summary { cursor: pointer; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  display: flex;
  align-items: center;
  gap: 14px;
  padding: max(17px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-right)) 17px max(24px, env(safe-area-inset-left));

}

.header-meta > span { padding-right: 20px; border-right: 1px solid var(--line); }

.route-panel[open] summary::after { rotate: 225deg; margin-top: 3px; }
.route-panel summary:hover { color: var(--accent); }
.route { display: grid; grid-template-columns: max-content minmax(0, 1fr); align-items: center; gap: 8px 10px; padding: 16px 0 0; color: var(--ink-2); font-size: 12px; }
.route select, .route .end { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); font-size: 16px; }
.route .end { overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
.route .end:hover { background: var(--surface); }
.route .end.empty { color: var(--ink-muted); }

.route-foot { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-height: 1lh; font-size: 12px; }
.route-note { margin: 0; }
#clear { flex: none; padding: 0 3px; border: 0; border-radius: 4px; background: transparent; color: var(--accent); font-size: 12px; text-decoration: underline; }
.picker { position: fixed; inset: auto; margin: 0; width: max-content; max-width: min(90vw, 380px); overflow: auto; overscroll-behavior: contain; padding: 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--ink); box-shadow: 0 8px 24px #0002; font: 14px/1.5 system-ui, sans-serif; }
.picker-floor { padding: 10px 10px 4px; color: var(--ink-muted); font-size: 11px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }
.picker-option { overflow: hidden; padding: 9px 10px; border-radius: 3px; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.picker-option.active { background: var(--ink); color: var(--surface); }
.picker-option[aria-selected="true"] { font-weight: 650; }
.directory { min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 20px 18px 24px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.list-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 6px 18px; }
.list-heading h2 { margin: 0; font-size: 13px; font-weight: 650; }
#result-count { color: var(--ink-muted); font-size: 11px; }
#list h2 { margin: 20px 0 5px; font-size: 12px; font-weight: 600; }
#list h2:first-child { margin-top: 0; }
.type { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 6px; border: 0; border-radius: 3px; background: transparent; color: var(--ink-2); font: inherit; text-align: left; }
.type::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.type::after { content: '−'; margin-left: auto; color: var(--ink-muted); font-size: 16px; line-height: 1; }
.type[aria-pressed="false"] { color: var(--ink-muted); }
.type[aria-pressed="false"]::before { background: none; border: 1px solid currentColor; }
.type[aria-pressed="false"]::after { content: '+'; }
.type:hover { background: var(--plane); }
.rooms { list-style: none; margin: 0; padding: 0; }
.rooms button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 9px 12px 9px 21px; border: 0; border-radius: 3px; background: transparent; text-align: left; }
.rooms button::after { content: ''; flex: none; width: 5px; height: 5px; margin-left: auto; border-top: 1px solid var(--ink-muted); border-right: 1px solid var(--ink-muted); rotate: 45deg; }
.rooms button:hover { background: var(--plane); }
.rooms button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: inset 2px 0 0 var(--accent); }
.rooms .code { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rooms .meta { color: var(--ink-2); font-size: 12px; }
.rooms .meta:empty { display: none; }
.rooms .floor { margin-left: auto; flex: none; padding: 2px 6px; border-radius: 5px; background: var(--plane); color: var(--ink-2); font-size: 11px; }
.rooms button:has(.floor)::after { display: none; }
.empty { color: var(--ink-2); font-size: 13px; }
#list > .empty { margin: 24px 6px; line-height: 1.8; }
.map { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; isolation: isolate; }
.map-heading { position: absolute; top: 22px; left: 22px; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 9px 16px 9px 9px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); box-shadow: var(--shadow); }
#collapse { width: 34px; height: 34px; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: transparent; }
#collapse[aria-expanded="false"] .icon { rotate: 180deg; }
.map-heading strong { display: block; font-size: 13px; font-weight: 650; }
.map-heading span { display: block; color: var(--ink-2); font-size: 11px; }
.map-help { position: absolute; left: 24px; bottom: 25px; z-index: 5; margin: 0; display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 11px; pointer-events: none; }
.map-help .icon { width: 16px; height: 16px; }
.toolbar { position: absolute; right: 22px; bottom: 20px; z-index: 5; display: flex; align-items: center; gap: 5px; padding: 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); box-shadow: var(--shadow); color: var(--ink-2); }
.toolbar button { display: grid; place-items: center; flex: none; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 3px; background: transparent; font-size: 21px; }
.toolbar button:hover { background: var(--plane); }
.toolbar button.wide { display: flex; gap: 7px; width: auto; margin-left: 6px; padding: 0 10px; border-left: 1px solid var(--line); border-radius: 0; font-size: 12px; }
.toolbar .icon { width: 17px; height: 17px; }
#zoom { width: 90px; height: 24px; accent-color: var(--accent); }
.viewport { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; background-color: var(--plane); touch-action: none; cursor: grab; scrollbar-width: none; }
.viewport::-webkit-scrollbar { display: none; }
.viewport.dragging { cursor: grabbing; }
/* The transparent border is pan space; percentages stay relative to the drawing. */
.plan { position: relative; box-sizing: content-box; width: 100%; border: solid transparent; border-width: 50svh 50vw; user-select: none; }
.plan img { display: block; width: 100%; aspect-ratio: 2659 / 1820; -webkit-touch-callout: none; touch-action: none; filter: invert(var(--plan-invert)) hue-rotate(calc(var(--plan-invert) * 180deg)); mix-blend-mode: multiply; opacity: .72; }
:root[data-theme="dark"] .plan img { mix-blend-mode: screen; opacity: .6; }
.route-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.route-line path { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.route-line .casing { stroke: var(--surface); stroke-width: 7; opacity: .85; }
.route-line .line { stroke: var(--accent); stroke-width: 3; }
.route-line circle { fill: var(--accent); stroke: var(--surface); stroke-width: 8; }
.marker {
  position: absolute;
  left: var(--x);
  top: var(--y);
  translate: -50% -50%;
  padding: 2px 5px;
  border: 1px solid color-mix(in srgb, var(--ink) 55%, var(--surface));
  border-left: 3px solid var(--c);
  border-radius: 3px;
  box-shadow: 0 0 0 1px var(--surface), 0 2px 4px #26323f2b;
  font: 600 11px/1.35 system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--ink);
  background: var(--surface);
}
.marker[data-color="1"] { --c: var(--series-1); }
.marker[data-color="2"] { --c: var(--series-2); }
.marker[data-color="3"] { --c: var(--series-3); }
.marker[data-color="4"] { --c: var(--series-4); }
.marker[data-color="5"] { --c: var(--series-5); }
.marker:is(:hover, :focus-visible, .hot, .via) { z-index: 3; scale: 1.1; }
.marker.hot, .marker.via { border-color: var(--accent); box-shadow: 0 0 0 1px var(--surface), 0 0 0 2px var(--accent); }
.marker.faded, .plan.pointing .marker:not(.hot) { opacity: .2; }
.plan.pointing .marker.hot { opacity: 1; }
.marker[aria-current="true"] { z-index: 4; scale: 1.15; color: var(--surface); background: var(--ink); border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.marker[data-type="Kaffemaskiner"] { padding: 0; border: 0; width: 31px; height: 25px; display: grid; place-items: center; background: none; box-shadow: none; font-size: 17px; line-height: 1; filter: drop-shadow(0 0 2px var(--surface)) drop-shadow(0 0 2px var(--surface)); }
.marker[data-type="Kaffemaskiner"]:is(:hover, :focus-visible, .hot, .via, [aria-current="true"]) { box-shadow: none; font-size: 24px; }
.grip { display: none; width: 100%; padding: 14px 0 8px; border: 0; background: none; cursor: grab; touch-action: none; }
.grip::before { content: ''; display: block; width: 34px; height: 4px; margin: 0 auto; border-radius: 99px; background: var(--line); }
@media (prefers-reduced-motion: no-preference) {
  button, summary { transition: background-color .15s, color .15s, border-color .15s; }
  .marker { transition: opacity .15s, scale .15s; }
}
@media (max-width: 1100px) {
  main { grid-template-columns: 310px minmax(0, 1fr); }
  .controls { padding: 24px 20px 18px; gap: 16px; }
  .map-help { display: none; }
}
@media (max-height: 760px) and (min-width: 721px) {
  .controls { padding-top: 18px; gap: 14px; }
  .intro h2 { font-size: 23px; }
  .intro p { display: none; }
}

  .app-header { padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); gap: 10px; }
  .brand-mark { width: 30px; height: 36px; }
  h1 { font-size: 15px; }
  .brand-caption { font-size: 11px; }
  .header-meta { margin-left: auto; }
  .header-meta > span { display: none; }
  #theme { width: 36px; height: 36px; }
  .map-heading { top: 14px; left: 14px; padding: 10px 14px; }
  .toolbar { right: 14px; bottom: 14px; }
  #zoom { display: none; }
  .toolbar button.wide { margin-left: 0; }
}

  main { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  aside { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; max-height: calc(100dvh - 80px - env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); border: 0; border-top: 1px solid var(--line); border-radius: 10px 10px 0 0; box-shadow: 0 -4px 20px #26323f0b; overflow: hidden; }

  aside:not(.open) .controls { border-bottom: 0; padding-bottom: 0; }
  .intro h2 { font-size: 23px; }
  .intro p { display: none; }
  .field-caption { margin-bottom: 7px; font-size: 10px; }
  .floors button { min-height: 42px; }
  .grip { display: block; flex: none; }
  #collapse { display: none; }
  #panel[hidden] { display: flex; }
  .directory { flex: 1; padding-top: 16px; }
  .toolbar { top: 14px; bottom: auto; }
  .toolbar button { width: 34px; height: 34px; }

}
</style>

<body>

<header class="app-header">
  <div class="brand-mark" aria-hidden="true">
    <svg class="icon" viewBox="0 0 24 24"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z M9 3v16 M15 5v16"/></svg>
  </div>
  <div><h1>Grensesvingen 6</h1><p class="brand-caption">Rom og etasjer</p></div>
  <div class="header-meta"><span>Etasje 3–8</span><button type="button" id="theme"></button></div>
</header>

<main>
  <aside id="panel">
    <!-- The sheet's drag handle on a phone. A button too, so a tap or the keyboard
         opens what a drag opens; display: none keeps it out of every other layout. -->
    <button type="button" class="grip" id="grip" aria-expanded="false"
            aria-controls="list" aria-label="Vis eller skjul romlisten"></button>
    <div class="controls">
      <div class="intro"><h2>Hvor skal du?</h2><p>Finn rommet. Bli kjent med kontoret.</p></div>
      <search>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="q" type="search" aria-label="Søk etter rom i alle etasjer"
               placeholder="Søk etter rom eller romtype" autocomplete="off">
      </search>
      <div><span class="field-caption">Velg etasje</span><nav class="floors" id="floors" aria-label="Etasje"></nav></div>
      <details class="route-panel" id="route-panel">
        <summary><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6h9a4 4 0 0 1 0 8H8a4 4 0 0 0 0 8" transform="translate(0 -2)"/></svg>Planlegg en rute</summary>
        <div class="route">
        <!-- aria-labelledby names the button after the word beside it and then its own
             text, so it reads "Fra, N 372 · 3. et." rather than just the room. -->
        <span id="from-label">Fra</span>
        <button type="button" class="end empty" id="from" role="combobox"
                aria-labelledby="from-label from" aria-haspopup="listbox"
                aria-controls="from-list" aria-expanded="false">Velg rom</button>
        <span id="to-label">Til</span>
        <button type="button" class="end empty" id="to" role="combobox"
                aria-labelledby="to-label to" aria-haspopup="listbox"
                aria-controls="to-list" aria-expanded="false">Velg rom</button>
        <label for="via">Via</label>
        <select id="via">
          <option value="heis">Heisen</option>
          <option value="trapp">Trappen</option>
          <option value="heis-kaffe">Heisen og Coffee Queen</option>
          <option value="trapp-kaffe">Trappen og Coffee Queen</option>
        </select>
        <div class="route-foot">
          <p class="route-note" id="route-note" aria-live="polite"></p>
          <button type="button" id="clear" hidden>Nullstill</button>
        </div>
        </div>
      </details>
    </div>
    <div class="directory">
      <div class="list-heading"><h2 id="list-title">Rom i etasjen</h2><span id="result-count" role="status"></span></div>
      <div id="list" aria-labelledby="list-title"></div>
    </div>
  </aside>

  <section class="map" aria-label="Etasjekart">
    <div class="map-heading">
      <button type="button" id="collapse" aria-expanded="true" aria-controls="panel"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg></button>
      <div><strong id="map-floor">3. etasje</strong><span>Grensesvingen 6</span></div>
    </div>
    <p class="map-help"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4-4 4 4 4 M4 8h12 M16 20l4-4-4-4 M20 16H8"/></svg>Dra for å utforske · Velg et rom for å se hvor det er</p>
    <div class="toolbar" role="group" aria-label="Kartvisning">
      <label for="zoom" class="sr-only">Zoom</label>
      <button type="button" id="out" aria-label="Zoom ut">−</button>
      <input id="zoom" type="range" min="100" max="450" step="1" value="100">
      <button type="button" id="in" aria-label="Zoom inn">+</button>
      <button type="button" id="fit" class="wide" aria-label="Tilpass kartet" title="Tilpass kartet"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5 M16 3h5v5 M21 16v5h-5 M8 21H3v-5"/></svg>Tilpass</button>
    </div>
    <div class="viewport" id="viewport">
      <div class="plan" id="plan">
        <!-- draggable="false": dragging an image is a native browser gesture, and it
             cancels the pointer stream we pan with the moment the mouse moves. -->
        <img id="planimg" alt="" draggable="false">
        <!-- The route, when there is one. The viewBox is the plan's pixel size, so
             its coordinates are the same ones rooms.json holds, scaled. -->
        <svg class="route-line" id="route-line" viewBox="0 0 2659 1820" aria-hidden="true"></svg>
      </div>
    </div>
  </section>
</main>

<!-- The two room lists, outside the panel because a popover lives in the top layer and
     has nothing to do with the panel's scrolling. Filled by renderPickers(). -->
<div class="picker" id="from-list" popover role="listbox" aria-labelledby="from-label"></div>
<div class="picker" id="to-list" popover role="listbox" aria-labelledby="to-label"></div>

<script>
const FLOOR_ORDER = ['3', '4', '5', '6', '7', '8'];
const TYPE_ORDER = ['Møterom', 'Multirom', 'Kaffemaskiner', 'Print/kopi', 'WC', 'Prosjektrom', 'Pod 1p', 'Podcast webrom', 'Sosial sone', 'Hvilerom', 'Datarom'];
// Five validated categorical hues. The two meeting-room types, the toilets and the
// print room are what people scan the plan for, so they get their own; everything
// else shares slot 3. The exact type is always spelled out in text, never colour
// alone.
const COLOR = { 'Møterom': '1', 'Multirom': '2', 'WC': '4', 'Print/kopi': '5' };

const el = {
  floors: document.getElementById('floors'),
  q: document.getElementById('q'),
  zoom: document.getElementById('zoom'),
  viewport: document.getElementById('viewport'),
  plan: document.getElementById('plan'),
  img: document.getElementById('planimg'),
  theme: document.getElementById('theme'),
  panel: document.getElementById('panel'),
  collapse: document.getElementById('collapse'),
  grip: document.getElementById('grip'),
  list: document.getElementById('list'),
  from: document.getElementById('from'),
  to: document.getElementById('to'),
  via: document.getElementById('via'),
  fromList: document.getElementById('from-list'),
  toList: document.getElementById('to-list'),
  clear: document.getElementById('clear'),
  line: document.getElementById('route-line'),
  note: document.getElementById('route-note'),
};

let rooms = {};       // floor -> [room]
let names = {};       // "N 381" -> "Bjørvika"
let floor = '3';
let selected = null;  // slug
let hidden = new Set();
let trip = { from: null, to: null };   // the two ends of the walk being shown
let via = 'heis';     // which of the two ways between floors the walk takes

const slug = code => code ? code.replace(/\s+/g, '') : '';
const norm = s => (s || '').toLowerCase().replace(/\s+/g, '');
const id = r => slug(r.code) || `${r.type}-${r.x}`;
// names.json wins: a room the drawing already names (the accessible toilets) can still
// be given a nicer one by hand.
const nameOf = r => names[r.code] || r.name || '';
const label = r => [r.code || 'uten romnummer', nameOf(r)].filter(Boolean).join(' · ');

function all() {
  return FLOOR_ORDER.flatMap(f => (rooms[f] || []).map(r => ({ ...r, floor: f })));
}

// Query only: a hidden type still gets its heading in the list, so hiding has to
// stay out of the search itself.
function matches(r, query) {
  if (!query) return true;
  return norm(r.code + r.type + nameOf(r)).includes(query);
}

const shown = (r, query) => !hidden.has(r.type) && matches(r, query);

/* ---------- rendering ---------- */

function renderFloors() {
  el.floors.replaceChildren(...FLOOR_ORDER.map(f => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = f + '.';
    b.setAttribute('aria-label', `${f}. etasje`);
    b.setAttribute('aria-current', String(f === floor));
    b.onclick = () => setFloor(f);
    return b;
  }));
}

function renderMarkers(query) {
  const markers = (rooms[floor] || [])
    .filter(r => !hidden.has(r.type))
    .map(r => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'marker';
      b.dataset.color = COLOR[r.type] || '3';
      b.dataset.id = id(r);
      b.dataset.type = r.type;
      b.style.setProperty('--x', (r.x * 100).toFixed(2) + '%');
      b.style.setProperty('--y', (r.y * 100).toFixed(2) + '%');
      // The number exactly as it is written everywhere else, space included; only
      // the deep link and the marker's own id run it through slug().
      // A coffee machine has no number to show, and a cup says what it is at a
      // glance where a bare dot says nothing. aria-label still spells the type out.
      b.textContent = r.code || (r.type === 'Kaffemaskiner' ? '☕' : '•');
      b.title = `${r.type} ${label(r)}`;
      b.setAttribute('aria-label', `${r.type} ${label(r)}`);
      if (query && !matches(r, query)) b.classList.add('faded');
      if (id(r) === selected) b.setAttribute('aria-current', 'true');
      b.onclick = () => select(id(r), false);
      return b;
    });
  // The pills these applied to are gone; the class would fade the new ones instead.
  el.plan.classList.remove('pointing');
  el.plan.replaceChildren(el.img, el.line, ...markers);
}

function roomButton(r, showFloor) {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.id = id(r);
  if (id(r) === selected && r.floor === floor) b.setAttribute('aria-current', 'true');

  const code = document.createElement('span');
  code.className = 'code';
  code.textContent = r.code || '—';
  const meta = document.createElement('span');
  meta.className = 'meta';
  meta.textContent = nameOf(r) || (r.code ? '' : r.type);
  b.append(code, meta);

  if (showFloor) {
    const f = document.createElement('span');
    f.className = 'floor';
    f.textContent = r.floor + '. et.';
    b.append(f);
  }
  b.onclick = () => {
    if (r.floor !== floor) setFloor(r.floor, id(r));
    else select(id(r), true);
  };
  return b;
}

function renderList(query) {
  const hits = (query ? all() : all().filter(r => r.floor === floor)).filter(r => matches(r, query));

  const groups = [];
  for (const type of TYPE_ORDER) {
    const inGroup = hits.filter(r => r.type === type);
    if (!inGroup.length) continue;

    // The heading doubles as the type's filter, so it is rendered whether the type
    // is hidden or not — hidden, it is the only way back.
    const h = document.createElement('h2');
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'type';
    toggle.dataset.type = type;
    toggle.style.setProperty('--c', `var(--series-${COLOR[type] || '3'})`);
    toggle.setAttribute('aria-pressed', String(!hidden.has(type)));
    toggle.textContent = `${type} (${inGroup.length})`;
    toggle.onclick = () => {
      hidden.has(type) ? hidden.delete(type) : hidden.add(type);
      render();
    };
    h.append(toggle);
    groups.push(h);
    if (hidden.has(type)) continue;

    const ul = document.createElement('ul');
    ul.className = 'rooms';
    ul.append(...inGroup.map(r => {
      const li = document.createElement('li');
      li.append(roomButton(r, Boolean(query)));
      return li;
    }));
    groups.push(ul);
  }

  if (!groups.length) {
    groups.push(Object.assign(document.createElement('p'), {
      className: 'empty',
      textContent: 'Ingen rom funnet. Prøv et annet romnummer eller en romtype.',
    }));
  }
  document.getElementById('list-title').textContent = query ? 'Søkeresultater · alle etasjer' : 'Rom i etasjen';
  document.getElementById('result-count').textContent = `${hits.filter(r => !hidden.has(r.type)).length} rom`;
  el.list.replaceChildren(...groups);
}

function render() {
  const query = norm(el.q.value);
  el.img.src = `plan-${floor}.png`;
  el.img.alt = `Plantegning ${floor}. etasje`;
  document.getElementById('map-floor').textContent = `${floor}. etasje`;
  renderFloors();
  renderMarkers(query);
  renderList(query);
  drawRoute();
  ringEnds();    // after the markers: it rings the route's ends, and they are rebuilt above
}

/* ---------- state ---------- */

// Every floor is rendered at the same size by build.py, so the plan's shape is a
// constant and needs no loaded image to measure.
const PLAN_RATIO = 1820 / 2659;

// Fit is the whole width — except in a window taller than the plan is at that width,
// where the leftover band would be most of the screen. There it fills the height
// instead and pans sideways. That case is a phone held upright.
// Where the panel is a sheet it lies over the bottom of the plan; in every other
// layout it is a column beside the plan and covers none of it.
const covered = () => getComputedStyle(el.panel).position === 'fixed' ? el.panel.offsetHeight : 0;

function fitZoom() {
  const box = el.viewport.getBoundingClientRect();
  if (box.height <= box.width) return 100;
  // Only a plan taller than the window by what the sheet covers can be dragged out
  // from under it. It also leaves the up and down drags something to move, which an
  // exact fill does not.
  return Math.min(450, Math.max(100, 100 * (box.height + covered()) / (box.width * PLAN_RATIO)));
}

// Fit, then park in the middle of whatever the plan overflows by. Against an edge —
// and filling the height puts the plan hard against its left one — half the drags a
// finger can make move nothing at all, which reads as a dead map rather than as an
// edge.
function centre() {
  el.viewport.scrollLeft = (el.viewport.scrollWidth - el.viewport.clientWidth) / 2;
  // The middle to aim for is the middle of what can be seen, and the sheet lies over
  // the bottom of that. Splitting the whole viewport instead parks the middle of the
  // plan under the sheet, leaving a band of empty above it — the plan reads as sitting
  // too low, by half the sheet.
  el.viewport.scrollTop = (el.viewport.scrollHeight - el.viewport.clientHeight + covered()) / 2;
}

function fit() {
  setZoom(fitZoom());
  centre();
  // On a first visit the plan is still on its way when this runs, and an image with
  // no height yet has no middle to find — the view would open at the top of the
  // slack instead of on the plan. Aim again the moment it has a size: at the room a
  // deep link asked for, whose own scroll missed for the same reason, or at the
  // middle of the plan.
  if (!el.img.complete) {
    el.img.addEventListener('load', () => selected ? select(selected, false) : centre(), { once: true });
  }
}

// Zooms around a point on screen (fingers, cursor) so it stays put; defaults to
// the middle of the viewport, which is what the slider and buttons want.
function setZoom(v, anchorX, anchorY) {
  const box = el.viewport.getBoundingClientRect();
  if (anchorX === undefined) {
    anchorX = box.left + box.width / 2;
    anchorY = box.top + box.height / 2;
  }
  // The plan's width is a percentage of the viewport, so it tracks the zoom value
  // exactly — no need to measure it, which would force a layout on every wheel tick.
  // Read the scroll offsets first: resizing the plan can clamp them on the way out.
  const from = Number(el.zoom.value);
  const x = anchorX - box.left;
  const y = anchorY - box.top;
  const scrolled = { x: el.viewport.scrollLeft, y: el.viewport.scrollTop };
  // The empty border around the plan is a fixed size and does not scale with it, so
  // it comes out of the arithmetic and goes back in afterwards.
  const slack = { x: el.plan.clientLeft, y: el.plan.clientTop };

  el.zoom.value = String(Math.round(Math.min(450, Math.max(100, v))));
  el.plan.style.width = el.zoom.value + '%';

  const scale = Number(el.zoom.value) / from;
  if (scale !== 1) {
    el.viewport.scrollLeft = slack.x + (scrolled.x + x - slack.x) * scale - x;
    el.viewport.scrollTop = slack.y + (scrolled.y + y - slack.y) * scale - y;
  }
}

function select(target, zoomIn) {
  selected = target;
  if (zoomIn && getComputedStyle(el.panel).position === 'fixed') {
    setSheet(false);
    el.q.blur();
  }
  if (zoomIn && Number(el.zoom.value) < 200) setZoom(200);
  render();
  const marker = [...el.plan.querySelectorAll('.marker')].find(m => m.dataset.id === target);
  if (marker) marker.scrollIntoView({ block: 'center', inline: 'center',
    behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  // The row is already marked current; bring it into the panel too, so a pill
  // clicked on the map points at its own row. 'nearest' so a row that is already
  // visible — the usual case when the click came from the panel — stays put.
  el.list.querySelector('[aria-current="true"]')?.scrollIntoView({ block: 'nearest' });
  writeHash();
}

function setFloor(f, target = null) {
  floor = f;
  selected = target;
  render();
  if (target) select(target, true);
  else {
    // Every floor is the same drawing at the same size, but a floor picked with no
    // room in mind is a fresh look at the building, not a continuation of wherever the
    // last one was dragged to — which on a phone can be a corner off screen.
    centre();
    writeHash();
  }
}

/* ---------- the URL ---------- */

// Everything the link carries: the floor being shown, the room picked on it, and the
// walk, if there is one. `#3/N372?fra=3/N372&til=7/S751&via=trapp`, and the older
// `#3/N372` still reads the same. One writer, so no caller can drop half of it.
// The slashes inside fra and til are left as slashes — legal in a fragment, and the
// links are meant to be pasted into Slack and read.
function writeHash() {
  const query = [];
  if (trip.from && trip.to) {
    query.push(`fra=${ref(trip.from)}`, `til=${ref(trip.to)}`);
    if (via !== 'heis') query.push(`via=${via}`);
  }
  history.replaceState(null, '', '#' + floor
    + (selected ? `/${selected}` : '')
    + (query.length ? `?${query.join('&')}` : ''));
}

function fromHash() {
  const [path, query] = decodeURIComponent(location.hash.slice(1)).split('?');
  const [f, target] = path.split('/');
  if (!FLOOR_ORDER.includes(f)) return;

  const params = new URLSearchParams(query);
  via = CORE[params.get('via')] ? params.get('via') : 'heis';
  trip = { from: pick(params.get('fra')), to: pick(params.get('til')) };
  document.getElementById('route-panel').open = Boolean(trip.from || trip.to);
  el.via.value = via;

  floor = f;
  selected = target || null;
  render();
  if (selected) select(selected, true);
}

/* ---------- the walk ---------- */

// The corridors, as axis-aligned segments in the same 0–1 plan coordinates the rooms
// use. Every floor is the same drawing at the same size, so one skeleton serves all
// six. Traced off the drawing by eye: enough to say which way round the building to
// walk, not a survey.
// ponytail: hand-traced, so a redrawn plan means retracing this — nine numbers pairs,
// cheaper than teaching the build script to find corridors.
const CORRIDORS = [
  [0.050, 0.252, 0.965, 0.252],   // north wing, its whole length
  [0.372, 0.252, 0.372, 0.677],   // the cross corridor, down past the lifts
  [0.327, 0.542, 0.372, 0.542],   // the lift doors
  [0.341, 0.677, 0.428, 0.677],   // the stair, and on towards the south wing
  [0.428, 0.677, 0.428, 0.858],   // into the south wing
  [0.050, 0.727, 0.950, 0.727],   // south wing, the corridor along its north side
  [0.050, 0.858, 0.950, 0.858],   // south wing, the one along its south side
  [0.900, 0.727, 0.900, 0.858],   // between those two, at the east end
  [0.825, 0.252, 0.825, 0.400],   // north wing, down to N 336
];
// The three shafts left of the middle, and the stair in the room below them. Both
// serve floors 3–8, so either one is the way between any two of them, and which one
// is the walker's to pick.
const CORE = {
  heis: { x: 0.327, y: 0.542, word: 'heisen' },
  trapp: { x: 0.341, y: 0.677, word: 'trappen' },
};
// The same two ways up, taken with a stop at the coffee machine on the eighth. The
// machine is a stop on the walk, not a third way between floors, so these carry the
// same point as the shaft they are named after.
CORE['heis-kaffe'] = { ...CORE.heis, coffee: true };
CORE['trapp-kaffe'] = { ...CORE.trapp, coffee: true };

// The one coffee machine on the map. Looked up rather than written down, so it moves
// when the drawing does.
const coffeeQueen = () => all().find(r => r.type === 'Kaffemaskiner');

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const key = p => `${p.x.toFixed(4)},${p.y.toFixed(4)}`;

// Where a point falls on a segment, clamped to its ends.
function project(p, [x1, y1, x2, y2]) {
  const dx = x2 - x1, dy = y2 - y1;
  const t = Math.max(0, Math.min(1, ((p.x - x1) * dx + (p.y - y1) * dy) / (dx * dx + dy * dy)));
  return { x: x1 + t * dx, y: y1 + t * dy };
}

// Where two corridors meet. Every segment is axis-aligned, so a crossing can only be
// one horizontal against one vertical, and its coordinates are one from each.
function crossing(a, b) {
  const level = s => s[1] === s[3];
  if (level(a) === level(b)) return null;
  const [h, v] = level(a) ? [a, b] : [b, a];
  const p = { x: v[0], y: h[1] };
  const on = ([x1, y1, x2, y2]) =>
    p.x >= Math.min(x1, x2) - 1e-9 && p.x <= Math.max(x1, x2) + 1e-9 &&
    p.y >= Math.min(y1, y2) - 1e-9 && p.y <= Math.max(y1, y2) + 1e-9;
  return on(h) && on(v) ? p : null;
}

// The shortest walk from a to b along the corridors, as the points to draw through.
// Each end joins the skeleton at the nearest point on the nearest corridor — the last
// few metres from a doorway, which no corridor is drawn for.
// The graph is rebuilt per call: with three dozen nodes that costs nothing, and it
// keeps the two joining points from having to be spliced in and out of a shared one.
function route(a, b) {
  const ends = [a, b].map(p => {
    let best = { d: Infinity };
    CORRIDORS.forEach((s, i) => {
      const q = project(p, s);
      const d = dist(p, q);
      if (d < best.d) best = { d, q, i };
    });
    return best;
  });

  const graph = new Map();
  const node = p => {
    const k = key(p);
    if (!graph.has(k)) graph.set(k, { x: p.x, y: p.y, k, links: new Map() });
    return graph.get(k);
  };
  const join = (m, n) => {
    const d = dist(m, n);
    if (d) { m.links.set(n.k, d); n.links.set(m.k, d); }
  };

  CORRIDORS.forEach((s, i) => {
    const points = [{ x: s[0], y: s[1] }, { x: s[2], y: s[3] }];
    CORRIDORS.forEach((t, j) => {
      const p = i !== j && crossing(s, t);
      if (p) points.push(p);
    });
    for (const end of ends) if (end.i === i) points.push(end.q);
    // In order along the segment, so neighbours in the list are neighbours in the
    // corridor and every walkable stretch becomes exactly one edge.
    points.sort((p, q) => (p.x - q.x) || (p.y - q.y));
    const nodes = points.map(node);
    for (let n = 1; n < nodes.length; n++) join(nodes[n - 1], nodes[n]);
  });

  // Dijkstra. On a graph this small, scanning for the nearest unvisited node beats
  // keeping a heap in sync.
  const start = node(ends[0].q).k, goal = node(ends[1].q).k;
  const cost = new Map([[start, 0]]);
  const came = new Map();
  const left = new Set(graph.keys());
  while (left.size) {
    let at = null;
    for (const k of left) if (cost.has(k) && (at === null || cost.get(k) < cost.get(at))) at = k;
    if (at === null) break;
    left.delete(at);
    if (at === goal) break;
    for (const [k, d] of graph.get(at).links) {
      const through = cost.get(at) + d;
      if (!(cost.get(k) <= through)) { cost.set(k, through); came.set(k, at); }
    }
  }
  if (!cost.has(goal)) return null;

  const path = [];
  for (let k = goal; k; k = came.get(k)) path.unshift(graph.get(k));
  return [a, ...path, b];
}

/* ---------- drawing the walk ---------- */

const SVG = 'http://www.w3.org/2000/svg';
// The viewBox is the plan's own pixel size, so a 0–1 coordinate scales straight into it.
const px = p => ({ x: p.x * 2659, y: p.y * 1820 });
const at = p => [p.x.toFixed(1), p.y.toFixed(1)];

// A walk with a stop in it comes back along the corridors it went out on, and one leg
// drawn over the other reads as a single line going nowhere. Every leg is shifted to
// the right of its own direction of travel, so out and back sit side by side as two
// lanes. The shift is measured after the scaling: the plan is half again as wide as it
// is tall, so a sideways nudge in 0–1 coordinates would come out lopsided.
// ponytail: lanes only say there are two legs, not which is which — add arrowheads
// (marker-mid) if the pair still reads ambiguously.
function lanes(points, by) {
  // A leg that starts or ends on a corridor repeats that point — its own joining
  // point is itself — and a segment of no length has no side to be shifted to.
  const p = points.map(px).filter((q, i, a) => !i || Math.hypot(q.x - a[i - 1].x, q.y - a[i - 1].y) > 0.01);
  if (!by) return p;
  const right = (a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    return len ? { x: -dy / len, y: dx / len } : null;
  };
  const normals = p.map((q, i) => i && right(p[i - 1], q));
  return p.map((q, i) => {
    // The mitre where the two shifted segments meet. Corners here are right angles, so
    // the two normals never point against each other and the divisor stays near 1.
    const a = normals[i] || normals[i + 1], b = normals[i + 1] || normals[i];
    if (!a) return q;
    const k = by / (1 + a.x * b.x + a.y * b.y);
    return { x: q.x + (a.x + b.x) * k, y: q.y + (a.y + b.y) * k };
  });
}

function stroke(className, points) {
  const path = document.createElementNS(SVG, 'path');
  path.setAttribute('class', className);
  path.setAttribute('d', 'M' + points.map(p => at(p).join(' ')).join(' L'));
  return path;
}

function dot(p) {
  const c = document.createElementNS(SVG, 'circle');
  const [x, y] = at(p);
  c.setAttribute('cx', x);
  c.setAttribute('cy', y);
  c.setAttribute('r', 18);
  return c;
}

// A room is `${floor}/${id}`, which is what the deep links carry.
function pick(value) {
  const [f, target] = (value || '').split('/');
  return all().find(r => r.floor === f && id(r) === target) || null;
}
const ref = r => `${r.floor}/${id(r)}`;

// Each end opens a listbox of every room. Not a <select>: that one is drawn by the OS,
// outside the page, so nothing can see the pointer move over its options — and lighting
// the room under the pointer on the plan is the whole point of the field. popover gives
// the top layer, the light dismiss and Escape; everything a <select> would also have
// given — arrows, Home/End, type-ahead, the active row, scrolling it into view — is
// below, once, for both ends.
function renderPickers() {
  for (const [which, box] of [['from', el.fromList], ['to', el.toList]]) {
    box.replaceChildren(...FLOOR_ORDER.flatMap(f => {
      const inFloor = (rooms[f] || []).map(r => ({ ...r, floor: f }));
      if (!inFloor.length) return [];

      const heading = document.createElement('div');
      heading.className = 'picker-floor';
      heading.setAttribute('aria-hidden', 'true');   // the group below carries the name
      heading.textContent = `${f}. etasje`;

      const group = document.createElement('div');
      group.setAttribute('role', 'group');
      group.setAttribute('aria-label', `${f}. etasje`);
      group.append(heading, ...inFloor
        .sort((p, q) => label(p).localeCompare(label(q), 'nb'))
        .map(r => {
          const option = document.createElement('div');
          // No slash: an id may hold one, but it makes the id unusable as a selector.
          option.id = `${which}-${f}-${id(r)}`;
          option.className = 'picker-option';
          option.setAttribute('role', 'option');
          option.setAttribute('aria-selected', 'false');
          option.dataset.ref = ref(r);
          option.dataset.id = id(r);   // what highlight() reads, as on a room row
          option.textContent = `${label(r)} · ${r.type}`;
          return option;
        }));
      return [group];
    }));
  }
}

function wirePicker(which, button, box) {
  let active = null;
  let typed = '';
  let typedAt = 0;
  let openAtPress = false;

  const options = () => [...box.querySelectorAll('[role="option"]')];

  // The active row is the one the arrows and the pointer land on. Focus stays on the
  // button, which points at it with aria-activedescendant, so there is no focus to
  // shuffle in and out of the list.
  function setActive(option, scroll = true) {
    active?.classList.remove('active');
    active = option || null;
    if (!active) {
      button.removeAttribute('aria-activedescendant');
      highlight(null);
      return;
    }
    active.classList.add('active');
    button.setAttribute('aria-activedescendant', active.id);
    if (scroll) active.scrollIntoView({ block: 'nearest' });
    highlight(active);   // the plan lights the room, the same call a room row makes
  }

  function move(step) {
    const all = options();
    const at = active ? all.indexOf(active) : -1;
    const to = step === 'first' ? 0
      : step === 'last' ? all.length - 1
      : Math.max(0, Math.min(all.length - 1, at + step));
    setActive(all[to]);
  }

  // Type-ahead, as a <select> has. Matching anywhere in the row rather than only at its
  // start: people know the room number, and "372" should find N 372.
  function typeAhead(char) {
    const now = performance.now();
    typed = now - typedAt > 800 ? char : typed + char;
    typedAt = now;
    const all = options();
    const hit = o => norm(o.textContent).includes(norm(typed));
    // From just past the active row, so the same letter again steps to the next match,
    // then round to the top.
    const after = all.slice(active ? all.indexOf(active) + (typed.length === 1 ? 1 : 0) : 0);
    setActive(after.find(hit) || all.find(hit) || active);
  }

  function open() {
    const b = button.getBoundingClientRect();
    const below = innerHeight - b.bottom;
    // Clear of the window's own edges: on a phone the bottom one is under the home
    // indicator, where the last room of the list would be untappable.
    const edge = 24;
    // Under the field, or over it when that is where the room is — on a phone the
    // panel is a sheet at the bottom of the screen and there is little below.
    Object.assign(box.style, below >= b.top
      ? { top: `${b.bottom + 4}px`, bottom: 'auto', maxHeight: `${below - edge}px` }
      : { bottom: `${innerHeight - b.top + 4}px`, top: 'auto', maxHeight: `${b.top - edge}px` });
    box.style.left = `${b.left}px`;
    box.style.minWidth = `${b.width}px`;
    box.showPopover();
  }

  function commit(option) {
    box.hidePopover();
    trip = { ...trip, [which]: pick(option.dataset.ref) };
    // Show the floor the walk starts on, or the room just picked if it is the only end.
    const show = trip.from || trip.to;
    if (show && show.floor !== floor) setFloor(show.floor);
    else { render(); writeHash(); }
  }

  // The light dismiss fires on the way down, so by the time the click arrives a press
  // on the open field's own button has already shut it. Without remembering what it
  // was before the press, the click below would open it straight back up.
  button.addEventListener('pointerdown', () => { openAtPress = box.matches(':popover-open'); });
  button.addEventListener('click', () => { if (!openAtPress) open(); });

  button.addEventListener('keydown', e => {
    if (!box.matches(':popover-open')) {
      if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) { e.preventDefault(); open(); }
      return;
    }
    switch (e.key) {
      case 'ArrowDown': move(1); break;
      case 'ArrowUp': move(-1); break;
      case 'PageDown': move(10); break;
      case 'PageUp': move(-10); break;
      case 'Home': move('first'); break;
      case 'End': move('last'); break;
      // Tab commits and moves on, the way leaving a <select> keeps what it is showing.
      case 'Tab': if (active) commit(active); return;
      case 'Enter': case ' ': if (active) commit(active); break;
      // Escape and everything else with a modifier belong to the popover and the page.
      case 'Escape': return;
      default:
        if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;
        typeAhead(e.key);
    }
    e.preventDefault();
  });

  box.addEventListener('mouseover', e => {
    const option = e.target.closest('[role="option"]');
    if (option) setActive(option, false);   // the pointer is already on it
  });
  box.addEventListener('click', e => {
    const option = e.target.closest('[role="option"]');
    if (option) commit(option);
  });

  box.addEventListener('toggle', e => {
    const open = e.newState === 'open';
    button.setAttribute('aria-expanded', String(open));
    if (!open) { setActive(null); typed = ''; return; }
    const chosen = trip[which];
    for (const option of options()) {
      option.setAttribute('aria-selected', String(Boolean(chosen) && option.dataset.ref === ref(chosen)));
    }
    setActive(options().find(o => o.getAttribute('aria-selected') === 'true') || options()[0]);
    button.focus();   // the keyboard talks to the button, not to the list
  });
}

wirePicker('from', el.from, el.fromList);
wirePicker('to', el.to, el.toList);

el.clear.onclick = () => {
  trip = { from: null, to: null };
  render();
  writeHash();
};

function drawRoute() {
  el.line.replaceChildren();
  el.note.textContent = '';
  const { from, to } = trip;

  for (const [end, button] of [[from, el.from], [to, el.to]]) {
    button.textContent = end ? `${label(end)} · ${end.floor}. et.` : 'Velg rom';
    button.classList.toggle('empty', !end);
  }
  el.clear.hidden = !from && !to;
  if (!from || !to || from === to) return;

  const core = CORE[via];
  // Where the walk stops, in order. A coffee way up puts the machine between the two
  // ends — unless it is already one of them, and then there is nothing to detour to.
  const machine = core.coffee ? coffeeQueen() : null;
  const stops = [from, ...(machine && ![from, to].some(r => ref(r) === ref(machine)) ? [machine] : []), to];

  // A change of floor between two stops is a ride or a climb, and each side of it is a
  // walk to or from the core. Only the floor being shown can be drawn, so a pair of
  // stops that happens elsewhere leaves nothing behind.
  const oneFloor = stops.every(s => s.floor === from.floor);
  const legs = [];
  for (let i = 1; i < stops.length; i++) {
    const [a, b] = [stops[i - 1], stops[i]];
    if (a.floor === b.floor) {
      if (floor === a.floor) legs.push(route(a, b));
    } else {
      if (floor === a.floor) legs.push(route(a, core));
      if (floor === b.floor) legs.push(route(core, b));
    }
  }

  // "uten romnummer" is how the lists write a numberless room; in a sentence about a
  // walk, the machine's own name is what to say.
  const stopName = s => s.code ? label(s) : nameOf(s) || label(s);
  const floors = [...new Set(stops.map(s => s.floor))].map(f => `${f}.`);
  el.note.textContent = oneFloor
    ? `${stops.map(stopName).join(' → ')}, ${from.floor}. etasje.`
    : stops.map((s, i) => (i && s.floor !== stops[i - 1].floor ? `${core.word} → ` : '')
        + `${stopName(s)} (${s.floor}. et.)`).join(' → ') + '.'
      + (legs.length ? ''
        : ` Velg ${floors.slice(0, -1).join(', ')} eller ${floors.at(-1)} etasje for å se ruten.`);

  if (legs.length) {
    // One leg has nothing to be told apart from, so it stays on the corridor's middle.
    const drawn = legs.map(l => lanes(l, legs.length > 1 ? 18 : 0));
    // Every casing first, so the second leg's casing cannot paint over the first's line.
    el.line.append(...drawn.map(l => stroke('casing', l)), ...drawn.map(l => stroke('line', l)));
    // The end that is a ride rather than a door needs saying on the plan; the ends
    // that are rooms wear their pill's ring, put on by ringEnds().
    if (!oneFloor) el.line.append(dot(px(core)));
  }
}

// Either end is worth pointing at on its own: picking Fra should show where that room
// is without waiting for Til.
function ringEnds() {
  for (const marker of el.plan.querySelectorAll('.marker')) {
    marker.classList.toggle('via', [trip.from, trip.to]
      .some(r => r && r.floor === floor && id(r) === marker.dataset.id));
  }
}

el.via.onchange = () => {
  via = el.via.value;
  render();
  writeHash();
};

/* ---------- theme ---------- */

// Cycles system -> light -> dark -> system, so picking a theme once doesn't mean
// giving up following the system forever. No stored value means follow.
const systemDark = matchMedia('(prefers-color-scheme: dark)');
const THEMES = {
  '': { icon: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor" stroke="none"/>', text: 'Tema: følger systemet', next: 'light' },
  light: { icon: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2 M12 20v2 M2 12h2 M20 12h2 M5 5l1.5 1.5 M17.5 17.5 19 19 M5 19l1.5-1.5 M17.5 6.5 19 5"/>', text: 'Tema: lyst', next: 'dark' },
  dark: { icon: '<path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3a8.5 8.5 0 1 0 10 10.5Z"/>', text: 'Tema: mørkt', next: '' },
};

function applyTheme() {
  const choice = localStorage.theme || '';
  document.documentElement.dataset.theme = choice || (systemDark.matches ? 'dark' : 'light');
  el.theme.innerHTML = `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${THEMES[choice].icon}</svg>`;
  el.theme.title = THEMES[choice].text;
  el.theme.setAttribute('aria-label', THEMES[choice].text);
}

el.theme.onclick = () => {
  const next = THEMES[localStorage.theme || ''].next;
  if (next) localStorage.theme = next;
  else localStorage.removeItem('theme');
  applyTheme();
};
systemDark.onchange = applyTheme;
applyTheme();

/* ---------- panel ---------- */

// Collapsed, the panel is plain [hidden]: it leaves the layout altogether and the
// plan takes the window. The toggle floats on the plan, so it survives the collapse
// and is the way back.
function setPanel(open) {
  el.panel.toggleAttribute('hidden', !open);
  el.collapse.setAttribute('aria-expanded', String(open));
  const text = open ? 'Skjul panelet' : 'Vis panelet';
  el.collapse.title = text;
  el.collapse.setAttribute('aria-label', text);
}

el.collapse.onclick = () => setPanel(el.panel.hidden);
setPanel(true);

/* ---------- the sheet, on a phone ---------- */

// Where the panel is a bar across the bottom of the plan, the grip drags it open and
// shut. Dragging sets a height in px and follows the finger; letting go snaps, by
// direction, to one of the two states CSS owns. Everywhere else the grip is
// display: none and none of this runs.
let grab = null;        // where the drag started, and the sheet's height there
let swallowTap = false; // a drag ends in a click of its own; that one must not toggle

function setSheet(open) {
  el.panel.classList.toggle('open', open);
  el.panel.style.height = '';   // back to the height the stylesheet picks
  el.grip.setAttribute('aria-expanded', String(open));
}

el.grip.addEventListener('pointerdown', e => {
  grab = {
    y: e.clientY,
    height: el.panel.offsetHeight,
    open: el.panel.classList.contains('open'),
    moved: false,
  };
});

// On the window, like the map's pan: the finger leaves the grip long before the
// gesture is over.
addEventListener('pointermove', e => {
  if (!grab) return;
  const dy = grab.y - e.clientY;
  if (!grab.moved && Math.abs(dy) < 4) return;
  grab.moved = true;
  // The list has to be in the sheet for the sheet to have anything to grow over.
  el.panel.classList.add('open');
  el.panel.style.height = Math.max(0, grab.height + dy) + 'px';
});

function endSheetDrag(e) {
  if (!grab) return;
  const { y, open, moved } = grab;
  grab = null;
  if (!moved) return;   // a tap: onclick below has it, and the keyboard with it
  swallowTap = true;
  const dy = y - e.clientY;
  setSheet(Math.abs(dy) > 40 ? dy > 0 : open);
}
addEventListener('pointerup', endSheetDrag);
addEventListener('pointercancel', endSheetDrag);

el.grip.onclick = () => {
  if (swallowTap) swallowTap = false;
  else setSheet(!el.panel.classList.contains('open'));
};

/* ---------- drag to pan, pinch to zoom ---------- */

const pointers = new Map();
let pinch = null;      // distance + zoom at the moment the second finger landed
let travelled = 0;     // so a drag that ends on a marker isn't taken for a click
let swallowUntil = 0;

el.viewport.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  pointers.set(e.pointerId, e);
  pinch = null;
  travelled = 0;
  el.viewport.classList.add('dragging');
});

addEventListener('pointermove', e => {
  const previous = pointers.get(e.pointerId);
  if (!previous) return;
  pointers.set(e.pointerId, e);
  const [a, b] = [...pointers.values()];

  if (b) {
    const spread = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (!pinch) pinch = { spread, zoom: Number(el.zoom.value) };
    else if (pinch.spread) {
      travelled = Infinity;
      setZoom(pinch.zoom * spread / pinch.spread, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
    }
  } else {
    const dx = e.clientX - previous.clientX;
    const dy = e.clientY - previous.clientY;
    travelled += Math.abs(dx) + Math.abs(dy);
    el.viewport.scrollLeft -= dx;
    el.viewport.scrollTop -= dy;
  }
  e.preventDefault();
}, { passive: false });

function endGesture(e) {
  if (!pointers.delete(e.pointerId)) return;
  pinch = null;
  if (!pointers.size) {
    el.viewport.classList.remove('dragging');
    // A drag's own click lands immediately. Anything later — a keyboard Enter on
    // a marker, say — is a real click and must get through.
    swallowUntil = travelled > 4 ? e.timeStamp + 300 : 0;
  }
}
addEventListener('pointerup', endGesture);
addEventListener('pointercancel', endGesture);

el.viewport.addEventListener('click', e => {
  if (e.timeStamp > swallowUntil) return;
  swallowUntil = 0;
  e.stopPropagation();
  e.preventDefault();
}, true);

// Every wheel event is ours: a trackpad pinch arrives as one with ctrlKey set, a
// two-finger scroll as one without. Letting the browser scroll the plan natively
// while we also write scrollLeft to anchor a zoom means two owners fighting over
// the same offset, which is what makes interleaved panning and pinching stutter.
el.viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const lines = e.deltaMode === 1 ? 16 : 1;   // some mice report lines, not pixels
  if (e.ctrlKey || e.metaKey) {
    // Pinch ticks are small and frequent; a mouse wheel notch is a single big one,
    // so cap the step or one notch would swallow the whole range.
    const step = Math.max(-30, Math.min(30, e.deltaY * lines));
    setZoom(Number(el.zoom.value) * Math.exp(-step / 120), e.clientX, e.clientY);
  } else {
    el.viewport.scrollLeft += e.deltaX * lines;
    el.viewport.scrollTop += e.deltaY * lines;
  }
}, { passive: false });

/* ---------- wiring ---------- */

// Reveal search results when the phone's directory is a collapsed sheet.
el.q.onfocus = () => setSheet(true);

// A search covers every floor, and the list says so. Follow it on the plan too: if
// nothing on the floor being shown matches, switch to the lowest floor that does,
// rather than leaving an empty plan next to a list full of hits.
el.q.oninput = () => {
  const query = norm(el.q.value);
  const hits = all().filter(r => shown(r, query));
  if (query && hits.length && !hits.some(r => r.floor === floor)) setFloor(hits[0].floor);
  else render();
};
// Hovering the panel points at the plan: a room row lights its own pill, a type's
// heading lights every pill of that type. Delegated on the list — it is rebuilt on
// every render — and mouseover/mouseout because those bubble, unlike mouseenter.
function highlight(target) {
  const room = target?.dataset.id;
  const type = target?.dataset.type;
  let lit = 0;
  for (const marker of el.plan.querySelectorAll('.marker')) {
    const hot = room ? marker.dataset.id === room : Boolean(type) && marker.dataset.type === type;
    marker.classList.toggle('hot', hot);
    lit += hot;
  }
  // Only fade the rest once something is actually lit: a row can point at a room on
  // another floor, and that must not dim the whole plan for nothing.
  el.plan.classList.toggle('pointing', lit > 0);
}
el.list.addEventListener('mouseover', e => highlight(e.target.closest('button')));
el.list.addEventListener('mouseout', () => highlight(null));

el.zoom.oninput = () => setZoom(Number(el.zoom.value));
document.getElementById('in').onclick = () => setZoom(Number(el.zoom.value) + 50);
document.getElementById('out').onclick = () => setZoom(Number(el.zoom.value) - 50);
document.getElementById('fit').onclick = fit;
window.onhashchange = fromHash;

Promise.all([
  fetch('rooms.json').then(r => r.json()),
  fetch('names.json').then(r => r.json()).catch(() => ({})),
]).then(([r, n]) => {
  rooms = r;
  names = n;
  renderPickers();
  // render() first: fit() measures the sheet, and the sheet is only as tall as the
  // floor buttons render it.
  render();
  fit();
  fromHash();
}).catch(err => {
  el.list.textContent = 'Klarte ikke å laste romdata.';
  console.error(err);
});

// Installable and offline-capable. Nothing on the page depends on it, so a browser
// without service workers — or the file opened straight off disk — just skips it.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
}
</script>
</body>
</html>
